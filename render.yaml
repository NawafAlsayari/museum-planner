# Render Blueprint for Museum & Planner (single container: API + SPA).
# Data and images live in a hosted Postgres database (e.g. Neon), so no
# persistent disk is required and the free web tier works.
#
# After this service is created, add two environment variables in the Render
# dashboard:
#   DATABASE_URL  - your Neon pooled connection string (host ends in -pooler)
#   DIRECT_URL    - your Neon direct connection string (same, minus -pooler)
# Example:
#   DATABASE_URL=postgresql://user:password@ep-xxx-pooler.region.aws.neon.tech/db?sslmode=require
#   DIRECT_URL=postgresql://user:password@ep-xxx.region.aws.neon.tech/db?sslmode=require
services:
  - type: web
    name: museum-planner
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Credentials: fill these two in the Render dashboard after the service
      # is created (see the note above). `sync: false` keeps them out of the
      # blueprint, so your values are never overwritten on later deploys.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
